# Source https://github.com/kubeflow/trainer/blob/v2.4.0/cmd/initializers/dataset/Dockerfile
name: dataset-initializer
summary: An image for Kubeflow Trainer dataset initializer
description: |
  Dataset initializer component for Kubeflow Trainer.
  This image runs the dataset initializer Python module used by Trainer jobs.
version: "2.4.0"
license: Apache-2.0
base: ubuntu@22.04

platforms:
  amd64:

services:
  dataset-initializer:
    override: merge
    command: "/app/.venv/bin/python -m pkg.initializers.dataset"
    startup: enabled
    working-dir: /app
    environment:
      PYTHONPATH: /app
      PATH: /app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

run-user: _daemon_

package-repositories:
  - type: apt
    ppa: deadsnakes/ppa
    priority: always

parts:
  dataset-initializer:
    plugin: nil
    source: https://github.com/kubeflow/trainer
    source-type: git
    source-tag: v2.4.0
    source-depth: 1
    build-packages:
      - python3.14
      - python3.14-venv
    stage-packages:
      - python3.14
      - ca-certificates
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/app

      # Install uv 0.7, as upstream copies it from ghcr.io/astral-sh/uv:0.7
      /usr/bin/python3.14 -m venv ${CRAFT_PART_BUILD}/uv-venv
      ${CRAFT_PART_BUILD}/uv-venv/bin/pip install --no-cache-dir "uv>=0.7,<0.8"
      UV=${CRAFT_PART_BUILD}/uv-venv/bin/uv

      cp ${CRAFT_PART_SRC}/cmd/initializers/dataset/pyproject.toml ${CRAFT_PART_INSTALL}/app/
      cp ${CRAFT_PART_SRC}/cmd/initializers/dataset/uv.lock ${CRAFT_PART_INSTALL}/app/
      cp -r ${CRAFT_PART_SRC}/pkg ${CRAFT_PART_INSTALL}/app/

      cd ${CRAFT_PART_INSTALL}/app
      UV_PYTHON=/usr/bin/python3.14 UV_PYTHON_DOWNLOADS=never UV_LINK_MODE=copy \
        UV_CACHE_DIR=${CRAFT_PART_BUILD}/uv-cache \
        ${UV} sync --locked --no-dev

      # Make plain `python3` (e.g. `pebble exec python3`) use Python 3.14 and see /app and the uv venv
      ln -sf python3.14 ${CRAFT_PART_INSTALL}/usr/bin/python3
      DIST_PACKAGES_DIR=${CRAFT_PART_INSTALL}/usr/local/lib/python3.14/dist-packages
      mkdir -p "${DIST_PACKAGES_DIR}"
      printf '%s\n' '/app' 'import site; site.addsitedir("/app/.venv/lib/python3.14/site-packages")' > ${DIST_PACKAGES_DIR}/dataset-initializer.pth

  security-team-requirement:
    after:
      - dataset-initializer
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && \
       dpkg-query -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) > \
       ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query
