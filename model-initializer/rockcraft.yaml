# Source https://github.com/kubeflow/trainer/blob/v2.4.0/cmd/initializers/model/Dockerfile
name: model-initializer
summary: An image for Kubeflow Trainer model initializer
description: |
  Model initializer component for Kubeflow Trainer.
  This image runs the model initializer Python module used by Trainer jobs.
version: "2.4.0"
license: Apache-2.0
base: ubuntu@22.04

platforms:
  amd64:

services:
  model-initializer:
    override: merge
    command: "/app/.venv/bin/python -m pkg.initializers.model"
    startup: enabled
    working-dir: /app
    environment:
      PYTHONPATH: /app
      PATH: /app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

run-user: _daemon_

package-repositories:
  - type: apt
    ppa: deadsnakes/ppa
    priority: always

parts:
  model-initializer:
    plugin: nil
    source: https://github.com/kubeflow/trainer
    source-type: git
    source-tag: v2.4.0
    source-depth: 1
    build-packages:
      - python3.14
      - python3-pip
    stage-packages:
      - python3.14
      - ca-certificates
    build-environment:
      - UV_PYTHON: /usr/bin/python3.14
      - UV_PYTHON_DOWNLOADS: never
      - UV_LINK_MODE: copy
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/app
      PYTHON_VERSION=$(/usr/bin/python3.14 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
      DIST_PACKAGES_DIR=${CRAFT_PART_INSTALL}/usr/local/lib/python${PYTHON_VERSION}/dist-packages
      mkdir -p ${DIST_PACKAGES_DIR}

      cp ${CRAFT_PART_SRC}/cmd/initializers/model/pyproject.toml ${CRAFT_PART_INSTALL}/app/
      cp ${CRAFT_PART_SRC}/cmd/initializers/model/uv.lock ${CRAFT_PART_INSTALL}/app/
      cp -r ${CRAFT_PART_SRC}/pkg ${CRAFT_PART_INSTALL}/app/

      # Install uv 0.7, as upstream copies it from ghcr.io/astral-sh/uv:0.7
      python3 -m pip install --no-cache-dir "uv==0.7.*"

      cd ${CRAFT_PART_INSTALL}/app
      uv venv --relocatable --python /usr/bin/python3.14 .venv
      uv sync --locked --no-dev

      # Expose the app and its venv to the system interpreter as `python3`,
      # so `pebble exec python3 ...` in the rock can import pkg.initializers.model
      printf '%s\n' /app /app/.venv/lib/python${PYTHON_VERSION}/site-packages > ${DIST_PACKAGES_DIR}/model-initializer.pth
      mkdir -p ${CRAFT_PART_INSTALL}/usr/bin
      ln -sf python${PYTHON_VERSION} ${CRAFT_PART_INSTALL}/usr/bin/python3

  security-team-requirement:
    after:
      - model-initializer
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && \
       dpkg-query -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) > \
       ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query
