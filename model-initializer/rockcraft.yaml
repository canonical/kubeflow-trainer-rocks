# Source https://github.com/kubeflow/trainer/blob/v2.4.0/cmd/initializers/model/Dockerfile
name: model-initializer
summary: An image for Kubeflow Trainer model initializer
description: |
  Model initializer component for Kubeflow Trainer.
  This image runs the model initializer Python module used by Trainer jobs.
version: "2.4.0"
license: Apache-2.0
base: ubuntu@26.04

platforms:
  amd64:

services:
  model-initializer:
    override: merge
    command: "/app/.venv/bin/python -m pkg.initializers.model"
    startup: enabled
    working-dir: /app

environment:
  PYTHONPATH: /app
  PATH: /app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

run-user: _daemon_

parts:
  model-initializer:
    plugin: nil
    source: https://github.com/kubeflow/trainer
    source-type: git
    source-tag: v2.4.0
    source-depth: 1
    build-packages:
      - python3-venv
    stage-packages:
      - python3.14
      - ca-certificates
    build-environment:
      - UV_PYTHON: "/usr/bin/python3.14"
      - UV_PYTHON_DOWNLOADS: "never"
      - UV_LINK_MODE: "copy"
    override-build: |
      set -eux -o pipefail

      # Install uv 0.7, as upstream copies it from ghcr.io/astral-sh/uv:0.7
      python3 -m venv --clear ${CRAFT_PART_BUILD}/uv-venv
      ${CRAFT_PART_BUILD}/uv-venv/bin/pip install --no-cache-dir "uv>=0.7,<0.8"
      UV=${CRAFT_PART_BUILD}/uv-venv/bin/uv
      export UV_CACHE_DIR=${CRAFT_PART_BUILD}/uv-cache

      # Built in place at its final path: uv embeds absolute paths in the venv,
      # so building elsewhere and copying later would break it.
      rm -rf /app
      mkdir -p /app/pkg
      cp ${CRAFT_PART_SRC}/cmd/initializers/model/pyproject.toml /app/
      cp ${CRAFT_PART_SRC}/cmd/initializers/model/uv.lock /app/
      cp -r ${CRAFT_PART_SRC}/pkg/initializers /app/pkg/

      cd /app
      ${UV} sync --locked --no-dev
      cp -a /app ${CRAFT_PART_INSTALL}/app

  security-team-requirement:
    after:
      - model-initializer
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && \
       dpkg-query -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) > \
       ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query
