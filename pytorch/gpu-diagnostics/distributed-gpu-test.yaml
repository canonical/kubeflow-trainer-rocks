apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-distributed
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
    - name: gpu-test-distributed
      image: ${IMAGE}
      imagePullPolicy: Never
      command: ["sleep", "3600"]
      resources:
        limits:
          nvidia.com/gpu: 2
      volumeMounts:
        - name: gpu-tests
          mountPath: /gpu-tests
  volumes:
    - name: gpu-tests
      hostPath:
        path: ${HOST_PATH}
        type: Directory
