apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-distributed
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
    - name: gpu-test-distributed
      image: docker.io/library/torch-distributed-runtime:2.7.1-cuda12.8-cudnn9-runtime
      imagePullPolicy: Never
      command: ["sleep", "3600"]
      resources:
        limits:
          nvidia.com/gpu: 2
      volumeMounts:
        - name: gpu-tests
          mountPath: /gpu-tests
  volumes:
    - name: gpu-tests
      hostPath:
        path: /home/ubuntu/gpu-tests
        type: Directory
